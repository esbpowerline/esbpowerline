# Daily grid ingest, four times a day, on GitHub's free runner minutes.
#
# Why here and not on Vercel: /api/cron/ingest returns 503 on Vercel by design —
# the Python chain (pandas over a 2,400-workbook archive, a 40 s forecast sweep,
# PyMuPDF over the gas PDF) is well past what a function should do, and Vercel
# cron would bill it as Active CPU on a $25 plan. This job costs nothing on top:
# a private repo gets 2,000 free Actions minutes a month and a run is ~4 minutes,
# so four a day is ~500. The site does not redeploy — `publish:local` writes
# DataRelease rows to Supabase and lib/data/releases.server.ts serves a release
# ahead of the static file, which is the whole reason that layer exists.
#
# Schedules are UTC. PGCB posts energy day D during the morning of D+1 (Dhaka,
# UTC+6) and Petrobangla files the gas window a day or two behind, so the polls
# sit at 09:30, 12:30, 16:30 and 21:30 Dhaka and each one re-runs the trailing
# three days (scripts/ingest_recent_days.py explains the window).
#
# NOTE: GitHub only fires `schedule` from the default branch. The workflow file
# must exist on `main`; it checks out and commits back to `authenticating`, so
# nothing it does touches a deploy.
name: ingest

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: trailing window length (energy days, ending yesterday in Dhaka)
        default: '3'
      until:
        description: last energy day to run, YYYY-MM-DD (default yesterday in Dhaka)
        default: ''
      publish:
        description: write DataRelease rows (uncheck to only commit the files)
        type: boolean
        default: true

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: authenticating
  PYTHONUTF8: '1'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: authenticating
          # The chain reads the archive under public/data (2,300 gas days for
          # the timeline, the daily files for the source index); a shallow
          # checkout is enough because it never reads history.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-daily-extractor.txt

      - name: Restore the workbook archive from the previous poll
        uses: actions/cache@v4
        with:
          path: .ingest-state
          # A key that never matches, so every run saves a fresh entry and the
          # next one restores the newest via the prefix.
          key: ingest-state-${{ github.run_id }}
          restore-keys: ingest-state-

      - name: Point the chain at the cached state
        # Everything the chain keeps between runs lives under one directory
        # that the Actions cache carries forward: the PGCB workbooks (the
        # forecast step needs yesterday's workbook as well as today's), the
        # extractor's drop and the energy-day → workbook index.
        run: |
          echo "ESB_PGCB_ARCHIVE=$GITHUB_WORKSPACE/.ingest-state/pgcb-archive" >> "$GITHUB_ENV"
          echo "ESB_DAILY_REPORTS_ROOT=$GITHUB_WORKSPACE/.ingest-state/daily-reports" >> "$GITHUB_ENV"
          echo "ESB_SOURCE_INDEX=$GITHUB_WORKSPACE/.ingest-state/source-index.json" >> "$GITHUB_ENV"

      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: pip install -r scripts/requirements-daily-extractor.txt

      - name: Ingest the trailing window
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          args="--days ${{ github.event.inputs.days || '3' }}"
          if [ -n "${{ github.event.inputs.until }}" ]; then args="$args --until ${{ github.event.inputs.until }}"; fi
          if [ "${{ github.event.inputs.publish }}" = "false" ]; then args="$args --no-publish"; fi
          python scripts/ingest_recent_days.py $args 2>&1 | tee ingest.log

      - name: Commit the archive back
        # The files are the archive of record and the release rows are only the
        # delivery path; a day that exists in Supabase but not in git would be
        # lost on the next deploy. Only data paths are staged — the chain must
        # never be able to commit code.
        run: |
          git config user.name  'esb-ingest[bot]'
          git config user.email 'esb-ingest@users.noreply.github.com'
          git add public/data lib/available-dates.json
          if git diff --cached --quiet; then echo 'nothing new'; exit 0; fi
          days=$(git diff --cached --name-only -- public/data/daily | sed -E 's#.*/([0-9-]+)\.json#\1#' | sort | tr '\n' ' ')
          git commit -m "chore(data): ingest energy day(s) ${days:-refresh} via scheduled poll"
          git pull --rebase origin "$DATA_BRANCH"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ingest.log
          retention-days: 14
